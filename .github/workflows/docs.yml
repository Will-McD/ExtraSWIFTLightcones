#
# Check the build of the documentation as Read the Docs does, with every warning an error.
#
# -n (nitpicky) also fails on any :func:, :class: or :type: name that doesn't link to its documentation. The built
# HTML is uploaded as an artifact (docs-html), so a pull request's docs can be downloaded and checked before merging.
# Build locally with:
#     pip install -e . -r docs/requirements.txt
#     sphinx-build -E -W -n --keep-going -b html docs docs/_build/html
#

name: Docs

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation build (sphinx-build -W -n)
    runs-on: ubuntu-latest
    # report without failing until the existing warnings are fixed. Remove this line then
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history so setuptools-scm can find version tags

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install MPI (needed to build mpi4py)
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin

    - name: Install SWIFTLET and the docs requirements
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r docs/requirements.txt

    - name: Build the docs (warnings are errors, nitpicky)
      run: |
        # -E: read every file again, -W: fail on any warning, -n: fail on links that don't resolve,
        # --keep-going: report every warning, not just the first
        sphinx-build -E -W -n --keep-going -b html docs docs/_build/html

    - name: Upload the built docs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
        retention-days: 7
