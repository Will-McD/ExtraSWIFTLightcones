#
# Build SWIFTLET
#
# The style checks are in styles.yml and the documentation build in docs.yml. 
# This workflow only stops on the errors that mean the code can't run 
# (syntax errors and undefined names), then installs SWIFTLET and runs the tests.
#

name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # every release (and pre-release) when it is published, testing the code of its tag
  release:
    types: [ "published" ]
  # a "Run workflow" button in the Actions tab, to test any branch by hand
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history so setuptools-scm can find version tags

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Lint with ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        # stop the build if there are Python syntax errors or undefined names
        ruff check . --select E9,F63,F7,F82 --output-format=github --statistics

    - name: Install MPI (needed to build mpi4py)
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenmpi-dev openmpi-bin

    - name: Install module
      run: |
        pip install -e ".[test]"

    - name: Check the package imports
      run: |
        python -c "import swiftlet.snapshot_lightcone, swiftlet.snapshot_orientation, swiftlet.snapshot_units, swiftlet.soap_reader, swiftlet.snapshot_cosmology, swiftlet.simulation_suites, swiftlet.snapshot_redshifts"

    - name: Test with pytest
      env:
        # the MPI tests run on 3 ranks. Git test runner has 2 cores. Let Open MPI place more processes than cores
        OMPI_MCA_rmaps_base_oversubscribe: "1"
      run: |
        pytest -v tests/
