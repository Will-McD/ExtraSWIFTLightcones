[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ExtraSWIFTLightcones"
dynamic = ["version"]
authors = [
  { name="William McDonald", email="mcdonald@strw.leidenuniv.nl" },
]
description = "Add ons for the post processing of SWIFT lightcones and building new lightcones from SWIFT snapshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lightcone_io",
    "swiftsimio",
    "numpy",
    "scipy",
    "unyt>=3.0",
    "h5py",
    "healpy",
    "astropy",
    "numba",
    "mpi4py",
    "virgodc>=1.0.2",
    "matplotlib",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest"]
examples = ["cmasher", "hdfstream","tqdm",]
all = ["ExtraSWIFTLightcones[test,examples]"]

[project.urls]
Homepage = "https://github.com/Will-McD/ExtraSWIFTLightcones"
Repository = "https://github.com/Will-McD/ExtraSWIFTLightcones.git"
Issues = "https://github.com/Will-McD/ExtraSWIFTLightcones/issues"

[project.scripts]
extra_swift_lightcones-configure = "extra_swift_lightcones.config:cli_configure"

[tool.setuptools]
packages = ["extra_swift_lightcones"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
