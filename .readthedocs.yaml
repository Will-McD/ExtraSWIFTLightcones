# Read the Docs build of the SWIFTLET documentation (https://docs.readthedocs.io/en/stable/config-file/v2.html).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # mpi4py, a requirement of SWIFTLET, is built against an MPI library
    - libopenmpi-dev
    - openmpi-bin
  jobs:
    post_checkout:
      # full history and tags, so setuptools-scm finds the version (Read the Docs clones only the latest commits)
      - git fetch --unshallow --tags || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
